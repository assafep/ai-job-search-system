services:
  persistence-api:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile
    ports:
      - "8080:8080"
    environment:
      # Leave the backend unset by default: once onboarding creates
      # config/runtime.json, the API should select Google Drive automatically.
      # Set REPOSITORY_BACKEND=memory explicitly for an isolated local run.
      REPOSITORY_BACKEND: "${REPOSITORY_BACKEND:-}"
      PERSISTENCE_API_URL: "http://persistence-api:8080"
      PERSISTENCE_API_TOKEN: "${PERSISTENCE_API_TOKEN:-}"
      GOOGLE_ACCESS_TOKEN: "${GOOGLE_ACCESS_TOKEN:-}"
      GOOGLE_REFRESH_TOKEN: "${GOOGLE_REFRESH_TOKEN:-}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      GOOGLE_INTERVIEW_JOURNAL_URL: "${GOOGLE_INTERVIEW_JOURNAL_URL:-}"
      GOOGLE_ARTIFACT_ROOT_URL: "${GOOGLE_ARTIFACT_ROOT_URL:-}"
      GOOGLE_APPLICATION_ROOT_PATH: "${GOOGLE_APPLICATION_ROOT_PATH:-}"
    volumes:
      - ./config:/app/config
