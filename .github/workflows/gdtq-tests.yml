name: GDTQ deterministic tests
on:
  push:
    branches: [feature/gdtq-workload-engine]
  pull_request:
    paths:
      - 'gdtq/**'
      - 'schemas/gdtq/**'
      - 'config/gdtq-*'
      - 'tests/**'
      - 'README.md'
      - 'docs/**'
      - 'adapters/**'
      - 'services/**'
      - '.github/workflows/gdtq-tests.yml'
jobs:
  gdtq-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest jsonschema PyYAML pypdf reportlab
      - run: PYTHONPATH=. python -m compileall -q gdtq
      - run: PYTHONPATH=. python -m pytest -q tests/test_gdtq.py

  compatibility-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest
      - run: PYTHONPATH=. python -m pytest -q
