name: AJSS tests
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --profile dev build gdtq-dev
      - run: docker compose --profile dev run --rm gdtq-dev python -m compileall -q gdtq adapters
      - run: docker compose --profile dev run --rm gdtq-dev python -m gdtq.cli doctor
      - run: docker compose --profile dev run --rm gdtq-dev python -m pytest -q tests/
