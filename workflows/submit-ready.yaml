name: submit-ready
trigger:
  type: application_submission_schedule
input_states:
  - Ready for Auto-Apply
steps:
  - read_ready_application
  - validate_stored_package
  - ready_queue_authorizes_submission
  - submit_through_browser_adapter
  - persist_submission_receipt
  - move_failed_auto_apply_to_manual_apply_required_with_explanation
  - move_to_applied_after_confirmed_receipt
outcomes:
  submitted: Applied
  failed: Manual Apply Required
  unconfirmed: Manual Apply Required
  waiting: null
  system_error: Dead Letters Queue
side_effects: through_data_layer_and_submission_adapter
