name: prepare-bookmarked
trigger:
  type: queued_application
input_states:
  - Bookmarked
steps:
  - read_bookmarked_application
  - personalize_application
  - generate_pdf
  - move_saved_package_to_ready_for_auto_apply
  - move_preparation_failures_to_dead_letters_queue
outcomes:
  prepared: Ready for Auto-Apply
  failed: Manual Apply Required
  duplicate: Duplicate
  system_error: Dead Letters Queue
side_effects: through_data_layer_and_runtime
