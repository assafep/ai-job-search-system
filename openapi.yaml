openapi: 3.0.3
info:
  title: AJSS Application Service
  version: 0.1.0
  description: >-
    Stable domain API. Google Drive is an implementation detail. When
    APPLICATION_SERVICE_TOKEN is configured, state endpoints require a bearer token;
    /health and /ready remain public. Validation failures return 400, missing
    resources return 404, upstream Drive/Docs HTTP failures return 502, and
    network/backend availability failures return 503.
security:
  - BearerAuth: []
paths:
  /bulk-updates:
    post:
      operationId: bulkUpdateItems
      description: >-
        Apply 1–25 explicit typed updates with a required idempotency key per item.
        Validate the entire request before writes. Execute items independently in order;
        return ordered per-item results and counts. This is not an atomic transaction
        across Drive and PostgreSQL. Reuse item keys on retry; changed payloads are
        rejected. Interrupted or uncertain mutations require manual reconciliation.
        No arbitrary URLs, API paths, or external message sends are accepted.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BulkUpdateRequest'}
      responses:
        '200':
          description: Ordered per-item outcomes; callers must inspect failures even with HTTP 200
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BulkUpdateResponse'}
        '400': {description: Invalid batch; no items executed}
        '401': {description: Authentication required}
  /journal/terminal-items:
    get:
      operationId: listTerminalJournalItems
      description: Read Rejected, Invalidated and Duplicate items from the main journal only, excluding archived applications.
      responses:
        '200':
          description: Eligible terminal items
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Application'}
  /workflows:
    get:
      operationId: listWorkflows
      description: List workflow names, accepted scope, and trigger kinds from deployed blueprints.
      responses:
        '200':
          description: Workflow catalog
          content:
            application/json:
              schema: {type: object}
  /workflow-runs:
    get:
      operationId: listWorkflowRuns
      description: List durable workflow requests for monitoring, newest created first (run ID breaks ties). Read-only; never claims or retries work. Optional exact status and workflow filters. Follow next_cursor with the same filters; null means the last page. Concurrent status changes may change filtered membership. This lists API-admitted requests, not legacy local workload registry entries.
      parameters:
        - name: status
          in: query
          schema: {type: string, enum: [queued, running, succeeded, failed, reconciliation_required]}
        - name: workflow
          in: query
          schema: {type: string, minLength: 1}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
        - name: cursor
          in: query
          description: Run ID returned as next_cursor on the previous page.
          schema: {type: string, minLength: 1}
      responses:
        '200':
          description: Public run records with timestamps, scope, summary and report metadata when available. Worker IDs and claim tokens are excluded.
          content:
            application/json:
              schema:
                type: object
                required: [runs, next_cursor]
                properties:
                  runs: {type: array, items: {type: object}}
                  next_cursor: {type: string, nullable: true}
        '400': {description: Invalid filters, limit, cursor, or repeated or unknown parameters}
        '401': {description: Authentication required}
    post:
      operationId: startWorkflow
      description: Enqueue a named workflow in the existing runtime. Omit limit to process all eligible positions. application_id scopes execution to one posting. Prepared submission is automatic. Reuse idempotency_key on retries. Requires a separately configured worker.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [workflow, idempotency_key]
              properties:
                workflow: {type: string, minLength: 1}
                application_id: {type: string, minLength: 1}
                limit: {type: integer, minimum: 1}
                idempotency_key: {type: string, minLength: 1, maxLength: 200}
      responses:
        '202':
          description: Durable run with resolved scope; duplicate keys return the existing run
          content:
            application/json:
              schema: {type: object}
  /workflow-runs/{run_id}:
    get:
      operationId: getWorkflowRun
      description: Read durable run status and resolved scope. A running claim is never automatically retried; old updated_at requires operator investigation.
      parameters:
        - {in: path, name: run_id, required: true, schema: {type: string}}
      responses:
        '200':
          description: Run status
          content:
            application/json:
              schema: {type: object}
  /workflow-runs/{run_id}/report:
    get:
      operationId: getWorkflowRunReport
      description: Retrieve the readable PDF activity report. Do not present internal JSON checkpoints as reports.
      parameters:
        - {in: path, name: run_id, required: true, schema: {type: string}}
      responses:
        '200':
          description: PDF bytes encoded as base64 with file metadata
          content:
            application/json:
              schema: {type: object}
        '409': {description: Report not available yet}
  /workflow-runs/{run_id}/reconcile:
    post:
      operationId: reconcileWorkflowRun
      x-mcp-expose: false
      description: Explicit operator action after stopping the original worker and reconciling uncertain submissions. Releases the installation run block without retrying this run.
      parameters:
        - {in: path, name: run_id, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [worker_stopped, note]
              properties:
                worker_stopped: {type: boolean, enum: [true]}
                note: {type: string, minLength: 1}
      responses:
        '200': {description: Reconciled run, kept failed}
  /workflow-runs/claim:
    post:
      operationId: claimWorkflowRun
      x-mcp-expose: false
      description: Internal authenticated worker claim. Serializes all chat runs and blocks on uncertain execution.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [worker_id]
              properties:
                worker_id: {type: string, minLength: 1}
      responses:
        '200': {description: Claimed run or null}
  /workflow-runs/{run_id}/worker-update:
    post:
      operationId: updateWorkflowRun
      x-mcp-expose: false
      description: Internal authenticated worker heartbeat or completion. Requires claim token.
      parameters:
        - {in: path, name: run_id, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [claim_token, status]
              properties:
                claim_token: {type: string}
                status: {type: string, enum: [running, succeeded, failed, reconciliation_required]}
                report: {type: object}
                code_revision: {type: string}
                summary: {type: object}
      responses:
        '200': {description: Updated run}
  /journal/complete-terminal:
    post:
      operationId: completeTerminalJournal
      description: Complete Rejected and Invalidated entries and remove Duplicate tabs from the main journal. Safe to repeat; completed entries are no longer in the main journal.
      responses:
        '200':
          description: Completed or removed journal entries
          content:
            application/json:
              schema:
                type: array
                items: {type: object}
  /journal/queues:
    get:
      operationId: journalQueueCounts
      description: Count current positions in every queue, including zeros. A monitor polls this once a second.
      responses:
        '200':
          description: Queue counts keyed by status
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {type: integer}
  /journal/tabs:
    get:
      operationId: listJournalTabs
      description: Read journal tab titles, parent IDs, and paragraphs, including operator staging tabs.
      responses:
        '200':
          description: Journal tabs
          content:
            application/json:
              schema:
                type: array
                items: {type: object}
  /journal/migrate-application-states:
    post:
      operationId: migrateApplicationStates
      description: Explicitly rename the legacy ready state tab in place and add Manual Apply Required and Dead Letters Queue. Preserves all child tabs and history; safe to repeat. Refuses ambiguous duplicate tabs.
      responses:
        '200':
          description: Migrated journal status
          content:
            application/json:
              schema: {type: object}
        '400': {description: Ambiguous or missing lifecycle state tabs}
  /storage/migrate-internal:
    post:
      operationId: migrateInternalStorage
      description: Move the profile and legacy submission receipts into .ai-job-search-system, preserving IDs and archiving older duplicate receipts.
      responses:
        '200':
          description: Migration report (safe to repeat)
          content:
            application/json:
              schema: {type: object}
  /health:
    get:
      operationId: health
      security: []
      responses:
        '200': {description: Healthy}
  /ready:
    get:
      operationId: readiness
      security: []
      responses:
        '200': {description: Persistence backend ready}
        '503': {description: Persistence backend unavailable}
  /applications:
    get:
      operationId: listApplications
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [Bookmarked, Prepared, Manual Apply Required, Dead Letters Queue, Applied, Interviewing, Rejected, Offer, Discovered, Duplicate]
      responses:
        '200':
          description: Applications
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Application'}
    post:
      operationId: createApplication
      description: Discovered creation is admitted only while the main journal has fewer than 100 total tabs. The service checks under the installation lock; keyed retries still return their existing application.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApplication'
      responses:
        '200':
          description: Discovery capacity exhausted; no application created
          content:
            application/json:
              schema:
                type: object
                required: [capacity_exhausted]
                properties:
                  capacity_exhausted: {type: boolean, enum: [true]}
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Application'}
  /profile:
    get:
      operationId: getApplicantProfile
      responses:
        '200':
          description: Applicant profile
          content:
            application/json:
              schema: {type: object}
    put:
      operationId: saveApplicantProfile
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
      responses:
        '200':
          description: Applicant profile saved
          content:
            application/json:
              schema: {type: object}
  /journal/status:
    get:
      operationId: getJournalStatus
      responses:
        '200':
          description: Required and present state tabs
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JournalStatus'}
  /journal/repair:
    post:
      operationId: repairJournalStateTabs
      responses:
        '200':
          description: Journal state tabs after explicit repair
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JournalStatus'}
  /files:
    get:
      operationId: readRootRelativeFile
      parameters:
        - name: path
          in: query
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Root-relative Drive file
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FileRead'}
    post:
      operationId: storeRootRelativeFile
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FileUpload'}
      responses:
        '201':
          description: Stored root-relative Drive file
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FileRecord'}
  /applications/{application_id}:
    get:
      operationId: getApplication
      parameters:
        - {$ref: '#/components/parameters/ApplicationId'}
      responses:
        '200':
          description: Application
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Application'}
        '404': {description: Not found}
  /applications/{application_id}/transition:
    post:
      operationId: transitionApplication
      parameters:
        - {$ref: '#/components/parameters/ApplicationId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Transition'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Application'}
  /applications/{application_id}/events:
    get:
      operationId: listApplicationEvents
      parameters:
        - {$ref: '#/components/parameters/ApplicationId'}
      responses:
        '200':
          description: Journal events
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/EventRecord'}
    post:
      operationId: appendApplicationEvent
      parameters:
        - {$ref: '#/components/parameters/ApplicationId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Event'
      responses:
        '201':
          description: Event appended
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EventRecord'}
  /applications/{application_id}/repair-format:
    post:
      operationId: repairApplicationJournalFormat
      parameters:
        - {$ref: '#/components/parameters/ApplicationId'}
      responses:
        '200':
          description: Application journal formatting repaired
          content:
            application/json:
              schema:
                type: object
                required: [application_id, events_repaired]
                properties:
                  application_id: {type: string}
                  events_repaired: {type: integer}
  /journal/rollback-prepared:
    post:
      operationId: rollbackReadyApplications
      responses:
        '200':
          description: Ready applications returned to Bookmarked while preserving stored artifacts
          content:
            application/json:
              schema:
                type: object
                required: [rolled_back]
                properties:
                  rolled_back:
                    type: array
                    items: {type: object}
  /applications/{application_id}/delete:
    post:
      operationId: deleteApplication
      parameters:
        - {$ref: '#/components/parameters/ApplicationId'}
      responses:
        '200':
          description: Application tab deleted from the journal
          content:
            application/json:
              schema: {type: object}
  /applications/{application_id}/artifacts:
    get:
      operationId: listApplicationArtifacts
      parameters:
        - {$ref: '#/components/parameters/ApplicationId'}
      responses:
        '200':
          description: Application artifacts
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Artifact'}
    post:
      operationId: storeApplicationArtifact
      parameters:
        - {$ref: '#/components/parameters/ApplicationId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArtifactUpload'
      responses:
        '201':
          description: Artifact stored
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Artifact'}
  /applications/{application_id}/artifacts/{artifact_id}:
    get:
      operationId: readApplicationArtifact
      parameters:
        - {$ref: '#/components/parameters/ApplicationId'}
        - name: artifact_id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Artifact content as base64
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ArtifactRead'}
  /applications/{application_id}/research:
    get:
      operationId: listApplicationResearch
      parameters:
        - {$ref: '#/components/parameters/ApplicationId'}
      responses:
        '200':
          description: Nested research tabs
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ResearchTab'}
    post:
      operationId: writeApplicationResearch
      parameters:
        - {$ref: '#/components/parameters/ApplicationId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResearchWrite'
      responses:
        '201':
          description: Research tab written
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResearchTab'}
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  parameters:
    ApplicationId:
      name: application_id
      in: path
      required: true
      schema: {type: string}
  schemas:
    BulkUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 25
          items:
            oneOf:
            - type: object
              additionalProperties: false
              required:
              - operation
              - idempotency_key
              - application_id
              - data
              properties:
                operation:
                  type: string
                  enum:
                  - update_application
                idempotency_key: &id002
                  type: string
                  minLength: 1
                  maxLength: 200
                application_id: &id003
                  type: string
                  minLength: 1
                expected_status: &id004
                  type: string
                  minLength: 1
                expected_updated_at: &id005
                  type: string
                  minLength: 1
                data:
                  type: object
                  additionalProperties: false
                  properties:
                    company: &id001
                      type: string
                      minLength: 1
                    role: *id001
                  required: []
                  minProperties: 1
            - type: object
              additionalProperties: false
              required:
              - operation
              - idempotency_key
              - application_id
              - data
              properties:
                operation:
                  type: string
                  enum:
                  - transition_application
                idempotency_key: *id002
                application_id: *id003
                expected_status: *id004
                expected_updated_at: *id005
                data:
                  type: object
                  additionalProperties: false
                  properties:
                    target: *id001
                    data:
                      type: object
                  required:
                  - target
            - type: object
              additionalProperties: false
              required:
              - operation
              - idempotency_key
              - application_id
              - data
              properties:
                operation:
                  type: string
                  enum:
                  - append_event
                idempotency_key: *id002
                application_id: *id003
                expected_status: *id004
                expected_updated_at: *id005
                data:
                  type: object
                  additionalProperties: false
                  properties:
                    event_type: *id001
                    data:
                      type: object
                  required:
                  - event_type
            - type: object
              additionalProperties: false
              required:
              - operation
              - idempotency_key
              - application_id
              - data
              properties:
                operation:
                  type: string
                  enum:
                  - complete_application
                idempotency_key: *id002
                application_id: *id003
                expected_status: *id004
                expected_updated_at: *id005
                data:
                  type: object
                  additionalProperties: false
                  properties:
                    reason:
                      type: string
                      enum:
                      - rejected
                      - invalidated
                      - filled
                      - withdrawn
                      - ghosted
                      - expired
                    inactive_before: *id001
                  required:
                  - reason
            - type: object
              additionalProperties: false
              required:
              - operation
              - idempotency_key
              - application_id
              properties:
                operation:
                  type: string
                  enum:
                  - remove_duplicate
                idempotency_key: *id002
                application_id: *id003
                expected_status: *id004
                expected_updated_at: *id005
            - type: object
              additionalProperties: false
              required:
              - operation
              - idempotency_key
              - data
              properties:
                operation:
                  type: string
                  enum:
                  - install_gmail_grant
                idempotency_key: *id002
                data:
                  type: object
                  additionalProperties: false
                  properties:
                    client_id: *id001
                    client_secret: *id001
                    refresh_token: *id001
                    notice_email: *id001
                    scope: *id001
                    expires_in:
                      type: integer
                      minimum: 1
                  required:
                  - client_id
                  - client_secret
                  - refresh_token
            - type: object
              additionalProperties: false
              required:
              - operation
              - idempotency_key
              - data
              properties:
                operation:
                  type: string
                  enum:
                  - acknowledge_gmail_notice
                idempotency_key: *id002
                data:
                  type: object
                  additionalProperties: false
                  properties:
                    refresh_expires_at:
                      type: integer
                      minimum: 1
                  required:
                  - refresh_expires_at
      required:
      - items
    BulkUpdateResponse:
      type: object
      required:
      - results
      - succeeded
      - failed
      properties:
        results:
          type: array
          items:
            type: object
            required:
            - index
            - operation
            - status
            properties:
              index:
                type: integer
              operation:
                type: string
              application_id:
                type: string
              status:
                type: string
                enum:
                - succeeded
                - failed
                - reconciliation_required
              result: {}
              error:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
        succeeded:
          type: integer
        failed:
          type: integer
    Error:
      type: object
      required: [error]
      properties:
        error: {type: string}
        field: {type: string}
        detail: {type: string}
        onboarding_command: {type: string}
    Application:
      type: object
      required: [application_id, company, role, posting_url, status]
      properties:
        application_id: {type: string}
        company: {type: string}
        role: {type: string}
        posting_url: {type: string, format: uri}
        status: {type: string, enum: [Bookmarked, Prepared, Manual Apply Required, Dead Letters Queue, Applied, Interviewing, Rejected, Offer, Discovered, Duplicate]}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        next_action: {type: string, nullable: true}
        next_action_at: {type: string, format: date-time, nullable: true}
        artifact_ids: {type: array, items: {type: string}}
        interview_ids: {type: array, items: {type: string}}
        last_event_id: {type: string, nullable: true}
    EventRecord:
      type: object
      required: [event_id, application_id, event_type, occurred_at, data]
      properties:
        event_id: {type: string}
        application_id: {type: string}
        event_type: {type: string}
        occurred_at: {type: string, format: date-time}
        data: {type: object}
    Artifact:
      type: object
      required: [artifact_id, application_id, name]
      properties:
        artifact_id: {type: string}
        application_id: {type: string}
        name: {type: string}
        drive_file_id: {type: string, nullable: true}
        mime_type: {type: string, nullable: true}
        created_at: {type: string, format: date-time}
    ArtifactRead:
      type: object
      required: [artifact, content_base64]
      properties:
        artifact: {$ref: '#/components/schemas/Artifact'}
        content_base64: {type: string, format: byte}
    FileRecord:
      type: object
      required: [file_id, path, name]
      properties:
        file_id: {type: string}
        path: {type: string}
        name: {type: string}
        mime_type: {type: string, nullable: true}
    FileUpload:
      type: object
      required: [path, content_base64]
      properties:
        path: {type: string, description: Relative path below the configured Drive root}
        mime_type: {type: string, nullable: true}
        content_base64: {type: string, format: byte}
        idempotency_key: {type: string}
    FileRead:
      type: object
      required: [file, content_base64]
      properties:
        file: {$ref: '#/components/schemas/FileRecord'}
        content_base64: {type: string, format: byte}
    JournalStatus:
      type: object
      required: [valid, required_states, present_states, missing_states, duplicate_states]
      properties:
        valid: {type: boolean}
        required_states: {type: array, items: {type: string}}
        present_states: {type: array, items: {type: string}}
        missing_states: {type: array, items: {type: string}}
        duplicate_states: {type: array, items: {type: string}}
    ResearchTab:
      type: object
      required: [application_id, title, content]
      properties:
        application_id: {type: string}
        title: {type: string}
        research_tab_id: {type: string}
        content: {type: string}
    CreateApplication:
      type: object
      required: [company, role, posting_url]
      properties:
        company: {type: string}
        role: {type: string}
        posting_url: {type: string, format: uri}
        data: {type: object}
        idempotency_key: {type: string}
    Transition:
      type: object
      required: [target]
      properties:
        target: {type: string, enum: [Bookmarked, Prepared, Manual Apply Required, Dead Letters Queue, Applied, Interviewing, Rejected, Offer, Discovered, Duplicate]}
        data: {type: object}
        idempotency_key: {type: string}
    Event:
      type: object
      required: [event_type]
      properties:
        event_type: {type: string}
        data: {type: object}
        idempotency_key: {type: string}
    ArtifactUpload:
      type: object
      required: [name, content_base64]
      properties:
        name: {type: string}
        mime_type: {type: string}
        content_base64: {type: string, format: byte}
        idempotency_key: {type: string}
    ResearchWrite:
      type: object
