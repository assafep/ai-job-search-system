openapi: 3.0.3
info:
  title: Job Search Persistence API
  version: 0.1.0
  description: >-
    Stable domain API. Google Drive is an implementation detail. When
    PERSISTENCE_API_TOKEN is configured, state endpoints require a bearer token;
    /health and /ready remain public. Validation failures return 400, missing
    resources return 404, upstream Drive/Docs HTTP failures return 502, and
    network/backend availability failures return 503.
security:
  - BearerAuth: []
paths:
  /journal/migrate-application-states:
    post:
      operationId: migrateApplicationStates
      description: Explicitly rename the legacy ready state tab in place and add Manual Apply Required. Preserves all child tabs and history; safe to repeat. Refuses ambiguous duplicate tabs.
      responses:
        '200':
          description: Migrated journal status
          content:
            application/json:
              schema: {type: object}
        '400': {description: Ambiguous or missing lifecycle state tabs}
  /storage/migrate-internal:
    post:
      operationId: migrateInternalStorage
      description: Move the profile and legacy submission receipts into .ai-job-search-system, preserving IDs and archiving older duplicate receipts.
      responses:
        '200':
          description: Migration report (safe to repeat)
          content:
            application/json:
              schema: {type: object}
  /health:
    get:
      operationId: health
      security: []
      responses:
        '200': {description: Healthy}
  /ready:
    get:
      operationId: readiness
      security: []
      responses:
        '200': {description: Persistence backend ready}
        '503': {description: Persistence backend unavailable}
  /applications:
    get:
      operationId: listApplications
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [Bookmarked, Ready for Auto-Apply, Manual Apply Required, Applied, Interviewing, Rejected, Offer]
      responses:
        '200':
          description: Applications
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Application'}
    post:
      operationId: createApplication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApplication'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Application'}
  /profile:
    get:
      operationId: getApplicantProfile
      responses:
        '200':
          description: Applicant profile
          content:
            application/json:
              schema: {type: object}
    put:
      operationId: saveApplicantProfile
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
      responses:
        '200':
          description: Applicant profile saved
          content:
            application/json:
              schema: {type: object}
  /journal/status:
    get:
      operationId: getJournalStatus
      responses:
        '200':
          description: Required and present state tabs
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JournalStatus'}
  /journal/repair:
    post:
      operationId: repairJournalStateTabs
      responses:
        '200':
          description: Journal state tabs after explicit repair
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JournalStatus'}
  /files:
    get:
      operationId: readRootRelativeFile
      parameters:
        - name: path
          in: query
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Root-relative Drive file
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FileRead'}
    post:
      operationId: storeRootRelativeFile
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FileUpload'}
      responses:
        '201':
          description: Stored root-relative Drive file
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FileRecord'}
  /applications/{application_id}:
    get:
      operationId: getApplication
      parameters:
        - {$ref: '#/components/parameters/ApplicationId'}
      responses:
        '200':
          description: Application
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Application'}
        '404': {description: Not found}
  /applications/{application_id}/transition:
    post:
      operationId: transitionApplication
      parameters:
        - {$ref: '#/components/parameters/ApplicationId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Transition'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Application'}
  /applications/{application_id}/events:
    get:
      operationId: listApplicationEvents
      parameters:
        - {$ref: '#/components/parameters/ApplicationId'}
      responses:
        '200':
          description: Journal events
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/EventRecord'}
    post:
      operationId: appendApplicationEvent
      parameters:
        - {$ref: '#/components/parameters/ApplicationId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Event'
      responses:
        '201':
          description: Event appended
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EventRecord'}
  /applications/{application_id}/repair-format:
    post:
      operationId: repairApplicationJournalFormat
      parameters:
        - {$ref: '#/components/parameters/ApplicationId'}
      responses:
        '200':
          description: Application journal formatting repaired
          content:
            application/json:
              schema:
                type: object
                required: [application_id, events_repaired]
                properties:
                  application_id: {type: string}
                  events_repaired: {type: integer}
  /journal/rollback-ready:
    post:
      operationId: rollbackReadyApplications
      responses:
        '200':
          description: Ready applications returned to Bookmarked while preserving stored artifacts
          content:
            application/json:
              schema:
                type: object
                required: [rolled_back]
                properties:
                  rolled_back:
                    type: array
                    items: {type: object}
  /applications/{application_id}/delete:
    post:
      operationId: deleteApplication
      parameters:
        - {$ref: '#/components/parameters/ApplicationId'}
      responses:
        '200':
          description: Application tab deleted from the journal
          content:
            application/json:
              schema: {type: object}
  /applications/{application_id}/artifacts:
    get:
      operationId: listApplicationArtifacts
      parameters:
        - {$ref: '#/components/parameters/ApplicationId'}
      responses:
        '200':
          description: Application artifacts
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Artifact'}
    post:
      operationId: storeApplicationArtifact
      parameters:
        - {$ref: '#/components/parameters/ApplicationId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArtifactUpload'
      responses:
        '201':
          description: Artifact stored
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Artifact'}
  /applications/{application_id}/artifacts/{artifact_id}:
    get:
      operationId: readApplicationArtifact
      parameters:
        - {$ref: '#/components/parameters/ApplicationId'}
        - name: artifact_id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Artifact content as base64
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ArtifactRead'}
  /applications/{application_id}/research:
    get:
      operationId: listApplicationResearch
      parameters:
        - {$ref: '#/components/parameters/ApplicationId'}
      responses:
        '200':
          description: Nested research tabs
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ResearchTab'}
    post:
      operationId: writeApplicationResearch
      parameters:
        - {$ref: '#/components/parameters/ApplicationId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResearchWrite'
      responses:
        '201':
          description: Research tab written
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResearchTab'}
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  parameters:
    ApplicationId:
      name: application_id
      in: path
      required: true
      schema: {type: string}
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: {type: string}
        field: {type: string}
        detail: {type: string}
        onboarding_command: {type: string}
    Application:
      type: object
      required: [application_id, company, role, posting_url, status]
      properties:
        application_id: {type: string}
        company: {type: string}
        role: {type: string}
        posting_url: {type: string, format: uri}
        status: {type: string, enum: [Bookmarked, Ready for Auto-Apply, Manual Apply Required, Applied, Interviewing, Rejected, Offer]}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        next_action: {type: string, nullable: true}
        next_action_at: {type: string, format: date-time, nullable: true}
        artifact_ids: {type: array, items: {type: string}}
        interview_ids: {type: array, items: {type: string}}
        last_event_id: {type: string, nullable: true}
    EventRecord:
      type: object
      required: [event_id, application_id, event_type, occurred_at, data]
      properties:
        event_id: {type: string}
        application_id: {type: string}
        event_type: {type: string}
        occurred_at: {type: string, format: date-time}
        data: {type: object}
    Artifact:
      type: object
      required: [artifact_id, application_id, name]
      properties:
        artifact_id: {type: string}
        application_id: {type: string}
        name: {type: string}
        drive_file_id: {type: string, nullable: true}
        mime_type: {type: string, nullable: true}
        created_at: {type: string, format: date-time}
    ArtifactRead:
      type: object
      required: [artifact, content_base64]
      properties:
        artifact: {$ref: '#/components/schemas/Artifact'}
        content_base64: {type: string, format: byte}
    FileRecord:
      type: object
      required: [file_id, path, name]
      properties:
        file_id: {type: string}
        path: {type: string}
        name: {type: string}
        mime_type: {type: string, nullable: true}
    FileUpload:
      type: object
      required: [path, content_base64]
      properties:
        path: {type: string, description: Relative path below the configured Drive root}
        mime_type: {type: string, nullable: true}
        content_base64: {type: string, format: byte}
        idempotency_key: {type: string}
    FileRead:
      type: object
      required: [file, content_base64]
      properties:
        file: {$ref: '#/components/schemas/FileRecord'}
        content_base64: {type: string, format: byte}
    JournalStatus:
      type: object
      required: [valid, required_states, present_states, missing_states, duplicate_states]
      properties:
        valid: {type: boolean}
        required_states: {type: array, items: {type: string}}
        present_states: {type: array, items: {type: string}}
        missing_states: {type: array, items: {type: string}}
        duplicate_states: {type: array, items: {type: string}}
    ResearchTab:
      type: object
      required: [application_id, title, content]
      properties:
        application_id: {type: string}
        title: {type: string}
        research_tab_id: {type: string}
        content: {type: string}
    CreateApplication:
      type: object
      required: [company, role, posting_url]
      properties:
        company: {type: string}
        role: {type: string}
        posting_url: {type: string, format: uri}
        data: {type: object}
        idempotency_key: {type: string}
    Transition:
      type: object
      required: [target]
      properties:
        target: {type: string, enum: [Bookmarked, Ready for Auto-Apply, Manual Apply Required, Applied, Interviewing, Rejected, Offer]}
        data: {type: object}
        idempotency_key: {type: string}
    Event:
      type: object
      required: [event_type]
      properties:
        event_type: {type: string}
        data: {type: object}
        idempotency_key: {type: string}
    ArtifactUpload:
      type: object
      required: [name, content_base64]
      properties:
        name: {type: string}
        mime_type: {type: string}
        content_base64: {type: string, format: byte}
        idempotency_key: {type: string}
    ResearchWrite:
      type: object
      required: [title, content]
      properties:
        title: {type: string}
        content: {type: string}
        idempotency_key: {type: string}
