[project]
name = "ai-job-search-system"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "reportlab==5.1.0",
    "pypdf==4.3.1",
    "phonenumbers==8.13.55",
    "psycopg[binary]==3.2.12",
    "cryptography==44.0.0",
    "mcp==1.26.0",
    "PyYAML==6.0.3",
    "jsonschema==4.26.0",
    "vercel-queue==0.10.0",
]

[project.optional-dependencies]
posting-fetcher = ["scrapling[fetchers]==0.5"]

[tool.vercel]
entrypoint = "api.index:handler"
